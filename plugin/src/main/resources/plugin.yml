name: MCAlive2
version: '${project.version}'
main: dev.celestia.mcalive2.MCAlive2Plugin
api-version: '26.2'
description: An AI decision brain that runs a fantasy RPG inside Minecraft - senses, actuators, ledger, and NPC runtime for the MCAlive2 director.
author: Celestia
commands:
  mcalive2:
    description: MCAlive2 admin command
    permission: mcalive2.admin
    usage: /mcalive2 <status|reload>
permissions:
  mcalive2.admin:
    default: op
