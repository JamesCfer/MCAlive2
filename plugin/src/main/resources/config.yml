# MCAlive2 configuration
bridge:
  # WebSocket bind address. Keep 127.0.0.1 unless brain/ runs on another machine.
  host: 127.0.0.1
  port: 8765
  # Auth token brain/ must present as the first message. CHANGE THIS.
  token: change-me

# Max blocks a single fill_region or build_blueprint call may change/place.
max-fill-volume: 100000

# Chunk-cell size (in chunks, so 8 = a 128x128 block cell) used to fire player_explored
# at most once per cell.
explored-cell-chunks: 8

# Radius in blocks that NPC speech (npc_say) is heard by players.
npc-chat-radius: 20.0

# Radius in blocks within which player chat is tagged with the nearest NPC
# (nearNpcId/nearNpcName), routing the brain to an actor turn for that NPC.
npc-chat-range: 8

# Minutes a player must go with zero other broadcast events (join/chat/explored/combat/
# etc) before a light player_idle_scene heartbeat fires for them. 0 disables this sense.
idle-scene-minutes: 12

# The world's spawn regime: creatures exist only as story.
#   hostile:   whitelist = only deliberate placement (CUSTOM, COMMAND, SPAWNER_EGG)
#              gets through; vanilla = untouched.
#   peaceful:  new-chunks = animals arrive with fresh terrain (CHUNK_GEN) and multiply
#              by husbandry (BREEDING, EGG, DISPENSE_EGG) or deliberate placement, but
#              ambient repopulation is off so herds are finite; vanilla = untouched.
#   villagers: banned = NO villager-family entity (villager, wandering trader, zombie
#              villager) may spawn by ANY means - CUSTOM and COMMAND included - and
#              pre-existing ones are purged as their chunks load (the cast is MCAlive2
#              NPCs only); vanilla = untouched.
spawn-control:
  hostile: whitelist      # whitelist | vanilla
  peaceful: new-chunks    # new-chunks | vanilla
  villagers: banned       # banned | vanilla

# DEPRECATED: replaced by spawn-control.hostile above. Still honored as an alias for
# old configs: if spawn-control.hostile is absent and this is false, hostiles fall
# back to vanilla.
suppress-hostile-spawns: true

# NPC self-defense (see the per-NPC "defense" field: fight | flee | none).
npc-defense:
  enabled: true
  # Melee damage an NPC deals when fighting back (half-hearts); a per-NPC attackDamage
  # overrides this when set.
  damage: 3.0
  # Blocks within which a fighting NPC can land a hit.
  melee-range: 2.5
  # Ticks between swings.
  cooldown-ticks: 20
  # A fight ends when the attacker gets this many blocks away...
  disengage-distance: 24
  # ...or when no damage has been exchanged (either direction) for this many seconds.
  disengage-seconds: 12

# Minutes between world_turn heartbeat events - the slow "the world itself gets a turn"
# cadence the brain uses to advance off-screen life. Fires only while at least one
# player is online. 0 disables this sense.
world-turn-minutes: 90

# Self-update: periodically checks GitHub releases and stages a newer MCAlive2.jar in
# plugins/update/ (Paper applies it automatically on the next server restart). A
# version already staged is never re-downloaded.
auto-update:
  enabled: true
  github-repo: JamesCfer/MCAlive2

  # Minutes between re-checks of GitHub releases, via a repeating async task.
  # 0 = check once, at startup only (the old behavior).
  # Do not go below 1 - GitHub's unauthenticated API allows 60 requests/hour.
  check-minutes: 2

  # If true, once an update is staged AND the server has had zero players for
  # empty-minutes, the plugin calls a full server shutdown so the staged jar gets
  # applied on the next start.
  #
  # IMPORTANT: only enable this if the server process is run under a restart loop
  # (see scripts/run-server.cmd at the repo root) that relaunches it after it exits.
  # Bukkit's shutdown() just stops the JVM - if nothing restarts it, the server goes
  # down and STAYS down until a human starts it again.
  #
  # Default false: leave disabled unless you've confirmed the restart loop is in place.
  apply-when-empty: false

  # Minutes of continuous zero-player time required before apply-when-empty triggers.
  empty-minutes: 10

# Behavior programs: director-authored crew goals (gather/build/deposit/...) the plugin
# runs indefinitely with zero AI involvement (see npc/behavior/BehaviorEngine).
behavior:
  # Master switch for the engine loop. Programs and blueprints stay stored either way;
  # false just freezes execution.
  enabled: true
  # Hold plugin chunk tickets at each crew member's current work chunk so crews keep
  # gathering/building with no player nearby. false = crews only progress while their
  # chunks happen to be loaded.
  keep-chunks-loaded: true
  # Defensive cap on how many chunk tickets one program may hold at once.
  max-chunk-tickets-per-program: 4

gadgets:
  # Runtime code-injection host: lets the brain grow new server-side capabilities by
  # compiling Java sent over the (token-authed) bridge. Set false to freeze - no new
  # gadgets compile or run.
  enabled: true
